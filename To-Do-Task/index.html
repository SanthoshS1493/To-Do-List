<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="bg-secondary">

    <!-- Container Content -->

    <div class="container w-50 mt-5">

        <div class="row d-flex justify-content-center">
            <div class="col-sm-9 col-md-11 my-2 col-lg-7">
                <h1 class="text-center text-warning">To-Do List</h1>

                <form action="" autocomplete="off">

                    <input type="text" name="" id="inputTask" class="form-control p-2 mb-3 " placeholder="Enter a task">

                    <button type="button" class="btn btn-primary w-100 mb-3">Add</button>
                </form>


                <ul class="list-group list-group-flush" id="taskList">

                </ul>

            </div>
        </div>
    </div>


     <!-- Modal Section -->

     <div class="modal fade" id="modalDisplay">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">Are you want to Delete this?</h4>
                    <!-- <button type="button" class="btn-close" data-bs-dismiss="modal"></button> -->
                </div>

                <div class="modal-footer">

                    <button class="btn btn-success btn-sm px-3" type="button" id="yes" data-bs-dismiss="modal">Yes</button>
                    <button class="btn btn-danger ms-2 btn-sm px-3" type="button" data-bs-dismiss="modal" id="no">No</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
        </script>

    <script src="./script.js"></script>

</body>

</html>
